# pyproject.toml
[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ftm150"
version = "1.0.0"
description = "Yaesu FTM-150R/E SD clone-image reader/editor"
requires-python = ">=3.13"
license = "GPL-3.0-or-later"

[project.optional-dependencies]
mcp = ["mcp>=1.2.0,<2"]
dev = ["pytest", "jsonschema", "ruff", "mypy", "setuptools>=77"]

[project.scripts]
ftm150 = "ftm150.cli:main"
ftm150-mcp = "ftm150.mcp.server:main"

[tool.setuptools]
packages = ["ftm150", "ftm150.engine", "ftm150.interop", "ftm150.mcp"]

[tool.setuptools.package-data]
ftm150 = ["schemas/*.json", "py.typed"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["local"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.13"
strict = true
